services:

  postgres-banking-service:
    image: postgres:18
    container_name: postgres-banking-service-container
    environment:
      - POSTGRES_USER=rafael
      - POSTGRES_PASSWORD=rafael
      - POSTGRES_DB=agencia
    ports:
      - 5433:5432
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
    driver: local
